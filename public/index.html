<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GORGOR V10.1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="roomScreen">
        <h2>Odaya Katıl</h2>
        <input id="roomName" placeholder="Oda adı">
        <input id="roomPassword" type="password" placeholder="Oda şifresi">
        <button id="joinBtn">Odaya Gir</button>
    </div>

    <div id="mainScreen">
        <video id="remoteVideo" autoplay playsinline webkit-playsinline></video>

        <div id="candleContainer" style="display:none;">
            <img id="candleGif" src="https://i.gifer.com/7VE.gif" alt="mum">
            <p>Bağlantı koptu... 🕯️<br><small>Mum yanıyor</small></p>
        </div>

        <div id="myVideoContainer">
            <video id="myVideo" autoplay playsinline webkit-playsinline muted></video>
            <button id="switchCameraBtn" class="cameraOverlayBtn">🔄</button>
            <button id="fullscreenBtn" class="cameraOverlayBtn">⛶</button>
            <select id="qualitySelect" class="qualitySelect">
                <option value="360">360p</option>
                <option value="480">480p</option>
                <option value="720" selected>720p</option>
                <option value="1080">1080p</option>
            </select>
        </div>

        <div id="cheekLockOverlay" style="display:none;">
            <div class="lockContent"><div style="font-size:60px;">📱</div><div>Kilitli</div><small>Çift tıkla aç</small></div>
        </div>

        <div id="settingsContainer">
            <button id="settingsBtn">⚙</button>
            <button id="micBtn">🎤</button>
            <button id="camBtn">📷</button>
            <button id="soundBtn">🔊</button>
            <button id="shareScreenBtn">📺</button>
            <button id="changePasswordBtn">🔐</button>
            <button id="lightModeBtn">💡</button>
            <button id="phoneLockBtn">📱</button>
            <div id="secretSettings">
                <label>Varsayılan silinme (max 1 saat):</label>
                <select id="defaultSelfDestructSelect">
                    <option value="300">5 dakika</option>
                    <option value="600">10 dakika</option>
                    <option value="1800" selected>30 dakika</option>
                    <option value="3600">1 saat</option>
                </select>
                <small style="font-size:10px;opacity:0.7;">Bugün 5 dk, yarın 30 dk yapabilirsin</small>
            </div>
            <div id="statusBar">
                <div class="statusBox">Ping: <span id="pingValue">-</span></div>
                <div class="statusBox">Bağlantı: <span id="connectionQuality">-</span></div>
            </div>
        </div>

        <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.1">

        <button id="chatToggle">💬</button>
        <div id="chatPanel">
            <div id="messages"></div>
            <div id="inputArea">
                <button id="mediaBtn">📎</button>
                <button id="locationBtn">📍</button>
                <input id="mediaInput" type="file" accept="image/*,video/*,audio/*" style="display:none">
                <select id="perMessageTimerSelect" title="Bu mesaj için süre">
                    <option value="default">Süre: Varsayılan</option>
                    <option value="60">1 dk kalsın</option>
                    <option value="300">5 dk kalsın</option>
                    <option value="1800">30 dk kalsın</option>
                    <option value="3600">1 saat kalsın</option>
                </select>
                <input id="messageInput" placeholder="Mesaj yaz...">
                <button id="nudgeBtn">👉</button>
                <button id="emojiBtn">😂</button>
                <button id="sendBtn">Gönder</button>
            </div>
            <div id="emojiPanel">
                <span class="flyEmoji" data-effect="heart">❤</span>
                <span class="flyEmoji" data-effect="kiss">😘</span>
                <span class="flyEmoji" data-effect="laugh">😂</span>
                <span class="flyEmoji" data-effect="thumbs">👍</span>
                <span class="flyEmoji" data-effect="cry">😢</span>
                <span class="flyEmoji" data-effect="wow">😮</span>
                <span class="flyEmoji" data-effect="flower">🌸</span>
                <span class="flyEmoji" data-effect="fire">🔥</span>
                <span class="flyEmoji" data-effect="love">😍</span>
                <span class="flyEmoji" data-effect="hug">🫶</span>
                <span id="addCustomEmoji" class="flyEmoji" style="background:#333;border-radius:6px;padding:2px 6px;">+</span>
            </div>
        </div>

        <div id="mediaPreview">
            <span id="closePreview">✖</span>
            <img id="previewImg">
            <video id="previewVideo" controls></video>
            <button id="downloadMediaBtn">İndir</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/simple-peer@9.11.1/simplepeer.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
