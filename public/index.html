<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>GORGOR V13 FINAL</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="roomScreen">
<h2>GORGOR V13</h2>
<input id="roomName" placeholder="Oda adı" value="oda1">
<input id="userName" placeholder="Kullanıcı adın (varım / yokum)">
<input id="roomPassword" type="password" placeholder="Oda şifresi = anahtar">
<button id="joinBtn">Odaya Gir</button>
<small style="opacity:0.6;text-align:center;margin-top:8px;display:block">🔒 E2E • 5dk/15dk RAM • 4s/24s/7gün Kalıcı<br>Zoom serbest • Tam ekranda sabit</small>
<div id="fakeRoomsList"></div>
<div id="userListBox"><div id="fakeUsersList"></div></div>
<small id="fakeRoomsHint" style="display:none;opacity:0.5">oda1 gerçek oda</small>
</div>
<div id="mainScreen">
<video id="remoteVideo" autoplay playsinline webkit-playsinline></video>
<div id="remoteZoomHint">İki parmakla yakınlaştır</div>
<div id="candleContainer"><div class="candle"><div class="flame"></div></div><p>Bağlantı koptu<br><small>🕯️ Bekleniyor...</small></p></div>
<div id="myVideoContainer">
<video id="myVideo" autoplay playsinline webkit-playsinline muted></video>
<button id="switchCameraBtn" class="cameraOverlayBtn">🔄</button>
<button id="fullscreenBtn" class="cameraOverlayBtn">⛶</button>
<select id="qualitySelect" class="qualitySelect"><option value="360">360p</option><option value="480">480p</option><option value="720" selected>720p</option><option value="1080">1080p</option></select>
</div>
<div id="phoneCallUI" style="display:none;"><div class="phoneAvatar">📞</div><div class="phoneName">Telefon Görüşmesi</div><div class="phoneStatus">Ses aktif</div><div class="phoneWave"><span></span><span></span></div></div>
<div id="settingsContainer">
<button id="settingsBtn">⚙</button>
<button id="micBtn">🎤</button>
<button id="camBtn">📷</button>
<button id="soundBtn">🔊</button>
<button id="phoneModeBtn">📞</button>
<button id="changePasswordBtn">🔐</button>
<button id="lightModeBtn">💡</button>
<button id="drawBtn">✏️</button>
<button id="panicBtn" style="background:#900">🚨</button>
<div id="secretSettings">
<label>Varsayılan yok olma süresi</label>
<select id="defaultSelfDestructSelect">
<option value="300">5 dakika (RAM)</option>
<option value="900">15 dakika (RAM)</option>
<option value="14400">4 saat (Kalıcı)</option>
<option value="86400" selected>24 saat (Kalıcı)</option>
<option value="604800">7 gün (Kalıcı)</option>
</select>
<small>5dk/15dk RAM, üstü kalıcı</small>
</div>
<div id="statusBar"><div class="statusBox">Ping: <span id="pingValue">-</span></div><div class="statusBox"><span id="connectionQuality">-</span></div><div class="statusBox" style="font-size:10px">🔒 E2E</div></div>
</div>
<input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.1">
<button id="chatToggle">💬</button>
<div id="chatPanel">
<div id="messages"></div>
<div id="inputArea">
<button id="mediaBtn">📎</button>
<button id="locationBtn">📍</button>
<input id="mediaInput" type="file" accept="image/*,video/*,audio/*" style="display:none">
<input id="cameraInput" type="file" accept="image/*" capture="environment" style="display:none">
<select id="perMessageTimerSelect">
<option value="default">Süre: Varsayılan</option>
<option value="300">5 dk (RAM)</option>
<option value="900">15 dk (RAM)</option>
<option value="14400">4 saat (Kalıcı)</option>
<option value="86400">24 saat (Kalıcı)</option>
<option value="604800">7 gün (Kalıcı)</option>
</select>
<input id="messageInput" placeholder="Şifreli mesaj...">
<button id="nudgeBtn">👉</button>
<button id="emojiBtn">😂</button>
<button id="sendBtn">Gönder</button>
</div>
<div id="emojiPanel">
<span class="flyEmoji" data-effect="heartRain">❤</span>
<span class="flyEmoji" data-effect="kissJump">😘</span>
<span class="flyEmoji" data-effect="fireFlash">🔥</span>
<span class="flyEmoji" data-effect="shake10">👉</span>
<span class="flyEmoji" data-effect="laugh">😂</span>
<span class="flyEmoji" data-effect="cry">😢</span>
<span class="flyEmoji" data-effect="wow">😮</span>
<span class="flyEmoji" data-effect="flower">🌸</span>
<span class="flyEmoji" data-effect="love">😍</span>
<span id="addCustomEmoji" class="flyEmoji" style="background:#333;border-radius:6px;padding:2px 6px;">+</span>
</div>
</div>
<div id="mediaPreview"><span id="closePreview">✖</span><img id="previewImg"><video id="previewVideo" controls></video><button id="downloadMediaBtn">İndir</button></div>
<div id="msnEffectLayer"></div>
<div id="drawOverlay" style="display:none"><canvas id="drawCanvas"></canvas><div class="drawTools"><button id="drawClear">Temizle</button><button id="drawSend">Gönder</button><button id="drawClose">Kapat</button></div></div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script src="https://unpkg.com/simple-peer@9.11.1/simplepeer.min.js"></script>
<script src="script.js"></script>
</body>
</html>
