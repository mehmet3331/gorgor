<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GORGOR V10 - Gizli + Mum + Telefon</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="roomScreen">
        <h2>GORGOR V10</h2>
        <input id="roomName" placeholder="Oda adı" aria-label="Oda adı">
        <input id="roomPassword" type="password" placeholder="Oda şifresi (gizli şifreleme anahtarı)" aria-label="Oda şifresi">
        <button id="joinBtn">Odaya Gir</button>
        <small style="opacity:0.6;margin-top:8px;text-align:center;">Kamera/mik otomatik açılmaz<br>Gizli mesajlar P2P şifreli gider</small>
    </div>

    <div id="mainScreen">
        <video id="remoteVideo" autoplay playsinline webkit-playsinline></video>
        
        <!-- MUM GIF PLACEHOLDER - bağlantı kopunca -->
        <div id="candleContainer" style="display:none;">
            <img id="candleGif" src="https://media.giphy.com/media/l1J9u3TZfpfeDLkdy/giphy.gif?cid=ecf05e47n6a2z2x3j3v3k3v3k3v3k" alt="yanan mum">
            <p>Bağlantı koptu... 🕯️<br><span style="font-size:14px;opacity:0.7;">Mum yanıyor, bekleniyor...</span></p>
        </div>

        <div id="myVideoContainer">
            <video id="myVideo" autoplay playsinline webkit-playsinline muted></video>
            <button id="switchCameraBtn" class="cameraOverlayBtn" aria-label="Kamerayı değiştir">🔄</button>
            <button id="fullscreenBtn" class="cameraOverlayBtn" aria-label="Tam ekran">⛶</button>
            <select id="qualitySelect" class="qualitySelect" aria-label="Görüntü kalitesi">
                <option value="360">360p</option>
                <option value="480">480p</option>
                <option value="720" selected>720p</option>
                <option value="1080">1080p</option>
            </select>
        </div>

        <!-- YANAK KİLİDİ OVERLAY -->
        <div id="cheekLockOverlay" style="display:none;">
            <div class="lockContent">
                <div style="font-size:60px;">📱</div>
                <div>Kilitli</div>
                <small>Açmak için çift tıkla</small>
            </div>
        </div>

        <div id="settingsContainer">
            <button id="settingsBtn" aria-label="Ayarlar">⚙</button>
            <button id="micBtn" aria-label="Mikrofon">🎤</button>
            <button id="camBtn" aria-label="Kamera">📷</button>
            <button id="soundBtn" aria-label="Ses">🔊</button>
            <button id="shareScreenBtn" aria-label="Ekran paylaş">📺</button>
            <button id="changePasswordBtn" aria-label="Şifre değiştir">🔐</button>
            <button id="lightModeBtn" aria-label="Gece/Gündüz">💡</button>
            <button id="phoneLockBtn" aria-label="Telefon kilidi">📱</button>
            <div id="secretSettings" style="display:none;flex-direction:column;gap:6px;background:rgba(0,0,0,0.9);padding:10px;border-radius:10px;">
                <label style="font-size:11px;color:#00ff88;">Varsayılan kaybolma süresi (max 1 saat):</label>
                <select id="defaultSelfDestructSelect" class="qualitySelect" style="position:static;width:140px;height:32px;">
                    <option value="5">5 saniye</option>
                    <option value="30">30 saniye</option>
                    <option value="60">1 dakika</option>
                    <option value="300">5 dakika</option>
                    <option value="1800" selected>30 dakika</option>
                    <option value="3600">1 saat</option>
                </select>
                <label style="font-size:11px;color:#00aaff;"><input type="checkbox" id="requireApproval" checked> Onaylı giriş/çıkış</label>
            </div>
            <div id="statusBar">
                <div class="statusBox">Ping: <span id="pingValue">-</span></div>
                <div class="statusBox">Bağlantı: <span id="connectionQuality">-</span></div>
            </div>
        </div>

        <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.1" aria-label="Ses seviyesi">

        <button id="chatToggle" aria-label="Sohbeti aç">💬</button>
        <div id="chatPanel">
            <div id="messages"></div>
            <div id="inputArea">
                <button id="mediaBtn" aria-label="Dosya ekle">📎</button>
                <button id="locationBtn" aria-label="Konum gönder">📍</button>
                <input id="mediaInput" type="file" accept="image/*,video/*,audio/*" style="display:none" aria-label="Medya dosyası seç">
                <button id="secretModeBtn" aria-label="Gizli mod" title="Gizli P2P mod">🕵️</button>
                <select id="perMessageTimerSelect" style="display:none;width:80px;height:40px;border-radius:8px;background:#111;color:#00ff88;border:1px solid #333;font-size:12px;">
                    <option value="default">Varsayılan</option>
                    <option value="5">5 sn</option>
                    <option value="30">30 sn</option>
                    <option value="60">1 dk</option>
                    <option value="300">5 dk</option>
                    <option value="1800">30 dk</option>
                    <option value="3600">1 saat</option>
                </select>
                <input id="messageInput" placeholder="Mesaj yaz..." aria-label="Mesaj">
                <button id="nudgeBtn" title="Dürt">👉</button>
                <button id="emojiBtn" aria-label="Emoji">😂</button>
                <button id="sendBtn" aria-label="Gönder">Gönder</button>
            </div>
            <div id="emojiPanel">
                <span class="flyEmoji" data-effect="heart">❤</span>
                <span class="flyEmoji" data-effect="kiss">😘</span>
                <span class="flyEmoji" data-effect="laugh">😂</span>
                <span class="flyEmoji" data-effect="thumbs">👍</span>
                <span class="flyEmoji" data-effect="cry">😢</span>
                <span class="flyEmoji" data-effect="wow">😮</span>
                <span class="flyEmoji" data-effect="flower">🌸</span>
                <span class="flyEmoji" data-effect="fire">🔥</span>
                <span class="flyEmoji" data-effect="love">😍</span>
                <span class="flyEmoji" data-effect="hug">🫶</span>
                <span id="addCustomEmoji" class="flyEmoji" style="background:#333;border-radius:6px;padding:2px 6px;">+</span>
            </div>
        </div>

        <div id="mediaPreview">
            <span id="closePreview" aria-label="Önizlemeyi kapat">✖</span>
            <img id="previewImg" alt="Medya önizleme">
            <video id="previewVideo" controls></video>
            <button id="downloadMediaBtn" aria-label="Medyayı indir">İndir</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/simple-peer@9.11.1/simplepeer.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
